<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Verification Code - ThesisHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: linear-gradient(rgba(0, 30, 60, 0.65), rgba(0, 0, 0, 0.75)), url("{{ url_for('static', filename='background 4.jpg') }}");
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .card-custom {
            background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px);
            border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%; max-width: 380px; padding: 30px;
        }
        .form-control-otp { letter-spacing: 4px; border-radius: 10px; }

        @media(max-width: 480px) {
            .card-custom { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="card card-custom">
        <h4 class="text-center fw-bold mb-3 text-dark">Enter Verification Code</h4>
        <p class="text-muted small text-center mb-4">A 6-digit code has been sent to your email.</p>
        <form action="{{ url_for('teacher_verify_otp') }}" method="POST">
            <div class="mb-3">
                <input type="text" name="otp" class="form-control form-control-otp text-center fs-4 fw-bold py-2" maxlength="6" placeholder="123456" required autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-3">Verify & Login</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
