<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher View - {{ thesis.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #212529;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .navbar-custom {
            background-color: #111417;
            padding: 10px 15px;
            border-bottom: 1px solid #3d4246;
            z-index: 100;
        }
        .pdf-viewer-frame {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
        }
    </style>
</head>
<body>
    <!-- Header Control Bar -->
    <div class="navbar-custom d-flex justify-content-between align-items-center text-white">
        <div class="d-flex align-items-center gap-2 text-truncate me-2" style="max-width: 65%;">
            <i class="bi bi-file-earmark-pdf-fill text-danger fs-5 d-none d-sm-inline"></i>
            <span class="fw-bold fs-6 text-truncate">{{ thesis.title }}</span>
        </div>
        <div class="d-flex align-items-center gap-2">
            {% if thesis.file_path %}
                <a href="{{ thesis.file_path }}" target="_blank" download class="btn btn-success btn-sm fw-bold">
                    <i class="bi bi-download me-1"></i> <span class="d-none d-sm-inline">Direct Download</span>
                </a>
            {% endif %}
            <a href="{{ url_for('teacher_major_display', dept=thesis.department) }}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back
            </a>
        </div>
    </div>

    <!-- Full PDF Display Window -->
    {% if thesis.file_path %}
        <iframe src="{{ thesis.file_path }}" class="pdf-viewer-frame"></iframe>
    {% else %}
        <div class="d-flex justify-content-center align-items-center flex-grow-1 text-white p-3 text-center">
            <h4>No PDF File Attached for this Thesis.</h4>
        </div>
    {% endif %}
</body>
</html>
