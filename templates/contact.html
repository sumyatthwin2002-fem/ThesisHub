<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ThesisHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-image: linear-gradient(rgba(0, 30, 60, 0.75), rgba(0, 0, 0, 0.85)), url("{{ url_for('static', filename='background 3.jpg') }}");
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; color: #ffffff;
        }
        .glass-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); border: none; color: #212529; }
        .section-title { color: #ffffff; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent pt-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="{{ url_for('home') }}">
                <i class="bi bi-mortarboard-fill text-warning me-2"></i>ThesisHub
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <div class="ms-auto mt-3 mt-lg-0 d-flex flex-column flex-lg-row gap-2">
                    <a href="{{ url_for('home') }}" class="btn btn-outline-light">Home</a>
                    <a href="{{ url_for('about') }}" class="btn btn-outline-light">About Us</a>
                    <a href="{{ url_for('feedback') }}" class="btn btn-outline-light">Feedback</a>
                    <a href="{{ url_for('contact') }}" class="btn btn-outline-light active">Contact Us</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <h2 class="display-6 display-md-5 fw-bold text-center mb-4 section-title">Get In Touch</h2>
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show mb-4 shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}
                <div class="card glass-card rounded-4 p-3 p-md-5 shadow-lg">
                    <form action="{{ url_for('contact') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Target Department Admin</label>
                            <select name="department" class="form-select rounded-3" required>
                                <option value="" disabled selected>Select Target Department</option>
                                <option value="PRINCIPAL">Principal / Main Admin</option>
                                <option value="EC">Electronic Engineering (EC)</option>
                                <option value="EP">Electrical Power Engineering (EP)</option>
                                <option value="MP">Mechanical Engineering (MP)</option>
                                <option value="CIVIL">Civil Engineering (CIVIL)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Your Name</label>
                            <input type="text" name="name" class="form-control rounded-3" value="{{ session.get('student_name', '') }}" placeholder="Enter your full name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" name="email" class="form-control rounded-3" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Subject</label>
                            <input type="text" name="subject" class="form-control rounded-3" placeholder="Inquiry subject" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Message</label>
                            <textarea name="message" class="form-control rounded-3" rows="4" placeholder="How can we help you?" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm">
                            <i class="bi bi-send-fill me-2"></i>Send Message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
