<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ thesis.title }} - Abstract</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: url("{{ url_for('static', filename='background 3.jpg') }}");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-color: #f8f9fa;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div class="container my-3 my-md-5">
        <div class="card shadow p-3 p-md-4 border-0 rounded-4">
            <h2 class="fs-3 fs-md-2 fw-bold text-dark">{{ thesis.title }}</h2>
            <p class="text-muted small">
                <strong>Author:</strong> {{ thesis.author or 'N/A' }} |
                <strong>Year:</strong> {{ thesis.pub_year or 'N/A' }} |
                <strong>Category:</strong> {{ thesis.category }}
            </p>
            <hr>
            <h4 class="fw-bold">Abstract</h4>
            <p style="white-space: pre-line;" class="mt-3 text-secondary lh-lg">{{ thesis.abstract or 'No Abstract Available.' }}</p>
            <div class="mt-4 d-flex flex-column flex-sm-row gap-2">
                <a href="{{ url_for('download_abstract_pdf', thesis_id=thesis.id) }}" class="btn btn-success fw-bold py-2">
                    Download Abstract (PDF)
                </a>
                <a href="{{ url_for('student_read_full_thesis', thesis_id=thesis.id) }}" class="btn btn-primary fw-bold py-2">
                    Read Full Thesis (Secure Viewer)
                </a>
            </div>
        </div>
    </div>
</body>
</html>
